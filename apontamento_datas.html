<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBFAF6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Apontamento" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<title>Apontamento de Datas — DC Pecém / SS&amp;B</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --bg: #F4F2EC; --paper: #FBFAF6; --paper-2: #F0EDE3;
  --ink: #0E0F10; --ink-2: #3C3D3F; --ink-3: #6B6C6F;
  --rule: #D9D5CB; --rule-2: #E7E3D8;
  --accent: #1F3D8A; --select: #0B5FFF;
  --ok: #1F8A5B; --warn: #C2A11A; --danger: #B23F2A; --inactive: #A8A39A;
  --shadow: 0 1px 0 rgba(14,15,16,0.05), 0 8px 24px -8px rgba(14,15,16,0.10);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink);
  font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; }
body { overscroll-behavior: none; }
button, input, textarea, select { font-family: inherit; color: inherit; font-size: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--select); outline-offset: 2px; }
input, textarea, select { -webkit-appearance: none; appearance: none; }
.mono { font-family: 'Geist Mono', ui-monospace, monospace; font-feature-settings: 'tnum'; }

#root { height: 100vh; height: 100dvh; }
.view { display: none; flex-direction: column; height: 100%; max-width: 680px; margin: 0 auto;
  background: var(--bg); position: relative; }
.view.active { display: flex; }

/* Header */
.head { background: var(--paper); border-bottom: 1px solid var(--rule); padding: 11px 14px;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.head .ico { width: 34px; height: 34px; background: var(--ink); color: #fff; border-radius: 7px;
  display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.head .htext { flex: 1; min-width: 0; }
.head .h1 { font-size: 14px; font-weight: 600; line-height: 1.2; }
.head .h2 { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.head input[type="date"] { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 5px;
  padding: 7px 9px; font-size: 13px; min-width: 130px; font-family: 'Geist Mono', monospace; }
.head .iconbtn { padding: 7px 12px; border: 1px solid var(--rule); border-radius: 6px; background: #fff;
  font-size: 18px; line-height: 1; min-width: 38px; min-height: 38px;
  display: flex; align-items: center; justify-content: center; }

/* Status bar */
.statusbar { display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 11.5px;
  background: var(--paper); border-bottom: 1px solid var(--rule-2); flex-shrink: 0; color: var(--ink-3); }
.statusbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.statusbar.warn .dot { background: var(--warn); }
.statusbar.error .dot { background: var(--danger); }
.statusbar .meta { margin-left: auto; color: var(--ink-3); font-family: 'Geist Mono', monospace; font-size: 10.5px; }

/* Body */
.body { flex: 1; overflow-y: auto; padding: 12px 12px 24px; -webkit-overflow-scrolling: touch; }
.body::-webkit-scrollbar { width: 6px; }
.body::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

/* DH Card */
.dh-card { background: var(--paper); border: 1px solid var(--rule); border-radius: 9px;
  padding: 13px 14px; margin-bottom: 12px; box-shadow: var(--shadow); }

/* Operator Card */
.op-card { background: var(--paper); border: 1px solid var(--rule); border-radius: 9px;
  padding: 13px 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.op-card.missing { border-color: var(--warn); background: rgba(194,161,26,0.06); }
.op-card .op-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.op-card select { width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: 6px;
  padding: 10px 12px; font-size: 14px; min-height: 44px; }
.op-card select:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31,61,138,0.12); }

/* Admin link in status bar */
.admin-link { background: none; border: 0; color: var(--ink-3); font-size: 11.5px;
  padding: 2px 6px; cursor: pointer; text-decoration: underline; }
.admin-link:hover { color: var(--ink); }

/* Admin view items */
.admin-empty { text-align: center; padding: 40px 20px; color: var(--ink-3);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 9px; box-shadow: var(--shadow); }
.admin-login-card { background: var(--paper); border: 1px solid var(--rule); border-radius: 9px;
  padding: 24px; margin-bottom: 12px; box-shadow: var(--shadow); text-align: center; }
.admin-login-card .title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.admin-login-card .help { font-size: 12.5px; color: var(--ink-3); margin-bottom: 16px; }
.admin-login-card .gbtn { display: inline-block; }

.admin-user { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  background: var(--paper-2); border: 1px solid var(--rule-2); border-radius: 7px;
  font-size: 12.5px; margin-bottom: 12px; }
.admin-user .who { flex: 1; font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--ink-2); }
.admin-user button { font-size: 12px; color: var(--ink-3); text-decoration: underline; background: none; border: 0; cursor: pointer; }

.admin-item { background: var(--paper); border: 1px solid var(--rule); border-radius: 9px;
  margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
.admin-item .ai-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  border-bottom: 1px solid var(--rule-2); }
.admin-item .ai-date { font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 14px; color: var(--ink); }
.admin-item .ai-op { flex: 1; font-size: 13px; color: var(--ink-2); }
.admin-item .ai-time { font-family: 'Geist Mono', monospace; font-size: 10.5px; color: var(--ink-3); }
.admin-item .ai-body { padding: 12px 14px; }
.admin-item .ai-resumo { font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.admin-item .ai-total { font-weight: 600; color: var(--ink); }
.admin-item .ai-detail-toggle { font-size: 12px; color: var(--accent); cursor: pointer;
  background: none; border: 0; padding: 0; text-decoration: underline; }
.admin-item .ai-detail { display: none; padding: 10px 12px; background: var(--paper-2);
  border-radius: 6px; margin-top: 10px; font-family: 'Geist Mono', monospace; font-size: 12px;
  line-height: 1.6; }
.admin-item .ai-detail.open { display: block; }
.admin-item .ai-detail .stage-line { padding: 3px 0; }
.admin-item .ai-detail .stage-label { font-weight: 600; color: var(--ink); }
.admin-item .ai-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--rule-2);
  background: var(--paper-2); }
.admin-item .ai-actions button { flex: 1; padding: 11px; font-size: 13.5px; font-weight: 600;
  border-radius: 6px; min-height: 42px; }
.admin-item .ai-reject { background: #fff; border: 1px solid var(--danger); color: var(--danger); }
.admin-item .ai-reject:active { background: rgba(178,63,42,0.08); }
.admin-item .ai-approve { background: var(--ok); color: #fff; border: 1px solid var(--ok); }
.admin-item .ai-approve:active { background: #167a4a; }
.dh-card .dh-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.dh-card .dh-help { font-size: 11px; color: var(--ink-3); margin-bottom: 10px; }
.dh-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.dh-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
  background: #fff; border: 1px solid var(--rule); border-radius: 16px;
  font-family: 'Geist Mono', monospace; font-size: 12.5px; font-weight: 500;
  min-height: 32px; transition: transform .08s; }
.dh-chip:active { transform: scale(0.97); }
.dh-chip .dh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--inactive); flex-shrink: 0; }
.dh-chip .rm { color: var(--ink-3); padding: 0 0 0 2px; font-size: 14px; line-height: 1; cursor: pointer; }
.dh-chip .rm:active { color: var(--danger); }
.dh-add-row { display: flex; gap: 8px; align-items: center; }
.dh-add-row input { flex: 1; background: #fff; border: 1px solid var(--rule); border-radius: 5px;
  padding: 9px 11px; font-size: 13px; min-height: 40px; font-family: 'Geist Mono', monospace; }
.dh-add-row input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31,61,138,0.12); }
.dh-add-row button { padding: 9px 14px; background: var(--ink); color: var(--paper);
  border-radius: 5px; font-size: 13px; font-weight: 500; min-height: 40px; white-space: nowrap; }

/* Stage Card */
.stage-card { background: var(--paper); border: 1px solid var(--rule); border-radius: 9px;
  margin-bottom: 12px; box-shadow: var(--shadow); }
.stage-card .scard-head { display: flex; align-items: center; gap: 10px; padding: 13px 14px;
  border-bottom: 1px solid var(--rule-2); background: var(--paper);
  border-top-left-radius: 8px; border-top-right-radius: 8px; }
.stage-card .emoji { font-size: 20px; flex-shrink: 0; }
.stage-card .title { flex: 1; font-weight: 600; font-size: 14px; }
.stage-card .total { font-family: 'Geist Mono', monospace; font-size: 14px; font-weight: 600;
  padding: 3px 10px; background: var(--paper-2); border-radius: 13px; min-width: 36px; text-align: center;
  color: var(--ink); }
.stage-card .total.zero { color: var(--ink-3); }
.stage-card .scard-body { padding: 12px 14px; }

/* Pillar input with autocomplete */
.fpicker { position: relative; }
.pillar-input { width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: 6px;
  padding: 11px 13px; font-size: 15px; font-family: 'Geist Mono', monospace; min-height: 46px; }
.pillar-input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31,61,138,0.12); }
.sugg { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff;
  border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); z-index: 50;
  max-height: 280px; overflow-y: auto; }
.sugg button { display: flex; width: 100%; align-items: center; justify-content: space-between;
  padding: 11px 13px; font-size: 14px; border-bottom: 1px solid var(--rule-2); text-align: left;
  font-family: 'Geist Mono', monospace; min-height: 44px; cursor: pointer; background: #fff;
  border-left: 0; border-right: 0; border-top: 0; color: var(--ink); }
.sugg button:last-child { border-bottom: 0; }
.sugg button:hover, .sugg button:active { background: var(--paper-2); }
.sugg .dh-tag { font-size: 10.5px; padding: 3px 9px; border-radius: 9px; color: #fff; font-weight: 600;
  letter-spacing: 0.02em; }
.sugg .empty { padding: 12px 14px; font-size: 12.5px; color: var(--ink-3); text-align: center; }
.pillar-help { font-size: 11px; color: var(--ink-3); margin-top: 4px; }

/* Pillar chips */
.fchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.fchip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 4px 5px 10px; background: #fff;
  border: 1px solid var(--rule); border-radius: 18px; font-family: 'Geist Mono', monospace;
  font-size: 13px; font-weight: 500; min-height: 34px; transition: transform .08s; }
.fchip:active { transform: scale(0.97); }
.fchip.done { border-color: var(--ok); background: rgba(31,138,91,0.06); }
.fchip.partial { border-color: var(--warn); background: rgba(194,161,26,0.08); }
.fchip.unassigned { background: rgba(194,161,26,0.10); border-color: var(--warn); }
.fchip .status-pid { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; padding: 2px 4px; }
.fchip .status-pid .stat { font-size: 14px; }
.fchip .dh-wrap { display: inline-flex; align-items: center; gap: 4px; padding: 0 2px; border-left: 1px solid var(--rule-2); margin-left: 2px; padding-left: 6px; }
.fchip .dh-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--inactive); flex-shrink: 0; }
.fchip select { background: transparent; border: 0; font: inherit; font-size: 11.5px; color: var(--ink-2);
  padding: 0 2px; cursor: pointer; max-width: 86px; }
.fchip select:focus { outline: 0; }
.fchip .rm { color: var(--ink-3); padding: 0 6px; font-size: 16px; line-height: 1; cursor: pointer;
  min-height: 30px; display: flex; align-items: center; }
.fchip .rm:active { color: var(--danger); }

/* Aux grid */
.aux-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: start;
  margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--rule-2); }
.aux-grid label { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em;
  font-weight: 600; padding-top: 9px; }
.aux-grid input, .aux-grid textarea { background: #fff; border: 1px solid var(--rule); border-radius: 5px;
  padding: 9px 11px; font-size: 13.5px; width: 100%; }
.aux-grid input:focus, .aux-grid textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31,61,138,0.12); }
.aux-grid input { min-height: 40px; }
.aux-grid textarea { min-height: 62px; resize: vertical; font-family: 'Geist Mono', monospace; }

/* Obs card */
.obs-card { background: var(--paper); border: 1px solid var(--rule); border-radius: 9px; padding: 14px;
  margin-bottom: 12px; box-shadow: var(--shadow); }
.obs-card label { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em;
  font-weight: 600; display: block; margin-bottom: 7px; }
.obs-card textarea { width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: 5px;
  padding: 10px 12px; font-size: 13.5px; min-height: 74px; resize: vertical; }
.obs-card textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31,61,138,0.12); }

/* Clear button */
.clearbtn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px;
  width: 100%; font-size: 12.5px; color: var(--ink-3); border: 1px dashed var(--rule); border-radius: 6px;
  background: transparent; margin-top: 4px; }
.clearbtn:disabled { opacity: 0.4; }
.clearbtn:active:not(:disabled) { background: rgba(178,63,42,0.05); border-color: var(--danger); color: var(--danger); }

/* Footer */
.foot { background: var(--paper); border-top: 1px solid var(--rule); padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 8px; flex-shrink: 0; }
.foot button { flex: 1; padding: 13px; font-size: 14.5px; font-weight: 600; border-radius: 7px; min-height: 48px; }
.foot .secondary { background: #fff; border: 1px solid var(--rule); color: var(--ink); }
.foot .secondary:active { background: var(--paper-2); }
.foot .secondary:disabled { color: var(--ink-3); }
.foot .primary { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }
.foot .primary:disabled { background: var(--ink-3); border-color: var(--ink-3); }
.foot .primary:active:not(:disabled) { background: var(--ink-2); }

/* Preview */
.preview-wrap { padding: 14px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.preview-wrap textarea { flex: 1; min-height: 280px; background: #fff; border: 1px solid var(--rule);
  border-radius: 7px; padding: 14px; font-size: 13px; font-family: 'Geist Mono', ui-monospace, monospace;
  line-height: 1.55; white-space: pre; resize: vertical; }
.preview-info { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  font-size: 11.5px; color: var(--ink-3); padding: 9px 11px; background: var(--paper);
  border: 1px solid var(--rule-2); border-radius: 6px; }
.preview-info .warn { color: var(--danger); margin-left: auto; }

/* Toast */
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 6px; font-size: 13px;
  box-shadow: var(--shadow); z-index: 200; max-width: 90vw; opacity: 0;
  pointer-events: none; transition: all 0.2s; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); }
.toast.success { background: var(--ok); }
</style>
</head>
<body>

<div id="root">

  <!-- ===== EDIT VIEW ===== -->
  <div id="viewEdit" class="view active">
    <div class="head">
      <div class="ico">📝</div>
      <div class="htext">
        <div class="h1">Apontamento do dia</div>
        <div class="h2" id="headSubtitle">0 pilares marcados</div>
      </div>
      <input type="date" id="dataExec">
    </div>

    <div class="statusbar" id="statusbar">
      <span class="dot"></span>
      <span id="statusLabel">Planilha conectada</span>
      <span class="meta" id="statusMeta">DC Pecém</span>
      <button type="button" class="admin-link" onclick="openAdmin()">Admin</button>
    </div>

    <div class="body">
      <!-- Operator Card -->
      <div class="op-card" id="opCard">
        <div class="op-title">👷 Operador</div>
        <select id="operatorSelect">
          <option value="">Selecione o operador…</option>
        </select>
      </div>

      <!-- DH Card -->
      <div class="dh-card">
        <div class="dh-title">📍 Locais (DH)</div>
        <div class="dh-help">Toque no × para remover. Personalize abaixo se precisar de DHs fora da lista padrão.</div>
        <div class="dh-chips" id="dhChips"></div>
        <div class="dh-add-row">
          <input type="text" id="newDhInput" placeholder="Ex: DH-11 ou ADM" autocomplete="off">
          <button type="button" onclick="addCustomDh()">Adicionar</button>
        </div>
      </div>

      <!-- Stage cards inserted here -->
      <div id="stages"></div>

      <!-- Observations -->
      <div class="obs-card">
        <label for="obsInput">📌 Observações gerais</label>
        <textarea id="obsInput" placeholder="Ex: Chuva forte no período da tarde, equipamento X em manutenção..."></textarea>
      </div>

      <!-- Clear all -->
      <button type="button" class="clearbtn" id="clearAllBtn" onclick="clearAll()">🗑 Limpar tudo</button>
    </div>

    <div class="foot">
      <button type="button" class="secondary" id="submitBtn" onclick="submitForm()" disabled>Enviar p/ aprovação</button>
      <button type="button" class="primary" id="reportBtn" onclick="openPreview()" disabled>Gerar Report</button>
    </div>
  </div>

  <!-- ===== ADMIN VIEW ===== -->
  <div id="viewAdmin" class="view">
    <div class="head">
      <button type="button" class="iconbtn" onclick="closeAdmin()" title="Voltar">‹</button>
      <div class="htext">
        <div class="h1">Aprovações pendentes</div>
        <div class="h2" id="adminSubtitle">Acesso restrito</div>
      </div>
      <button type="button" class="iconbtn" id="adminRefreshBtn" onclick="refreshPending()" title="Atualizar" style="display:none">↻</button>
    </div>
    <div class="body" id="adminBody">
      <!-- Login or pending list inserted here -->
    </div>
  </div>

  <!-- ===== PREVIEW VIEW ===== -->
  <div id="viewPreview" class="view">
    <div class="head">
      <button type="button" class="iconbtn" onclick="closePreview()" title="Voltar">‹</button>
      <div class="htext">
        <div class="h1">Preview do Report</div>
        <div class="h2">Toque em copiar para enviar no WhatsApp</div>
      </div>
    </div>
    <div class="preview-wrap">
      <div class="preview-info" id="previewInfo"></div>
      <textarea id="previewText" readonly></textarea>
    </div>
    <div class="foot">
      <button type="button" class="secondary" onclick="closePreview()">Voltar</button>
      <button type="button" class="primary" onclick="copyReport()">📋 Copiar texto</button>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
// ============ CONFIG ============
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyl11sxsSfroQmMldWg9AUi09jOQzpbbSerK2f9osmd5AWiHoUYEqV5oTZQALMiU8aq1w/exec";

// ⚠ Cole aqui o Client ID gerado no Google Cloud Console (mesmo valor do Code.gs)
const OAUTH_CLIENT_ID = "SEU_CLIENT_ID.apps.googleusercontent.com";

// ⚠ Lista de operadores autorizados (edite conforme a equipe)
const OPERATORS = [
  "João Silva",
  "Maria Santos",
  "Pedro Costa",
  "Antônio Oliveira",
  "Carlos Pereira",
];

function defaultCommonLocais() {
  return Array.from({length: 10}, (_, i) => {
    const n = i + 1;
    return "DH-" + (n < 10 ? "0" + n : String(n));
  });
}

state.commonLocais = defaultCommonLocais();

const STORAGE_KEY = "apontamento_datas_v2";
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.data) state.data = saved.data;
    if (saved.operador) state.operador = saved.operador;
    if (saved.observacoes) state.observacoes = saved.observacoes;
    if (Array.isArray(saved.commonLocais) && saved.commonLocais.length > 0) state.commonLocais = saved.commonLocais;
    if (saved.stages) {
      Object.keys(saved.stages).forEach(k => {
        if (state.stages[k]) {
          const s = saved.stages[k];
          if (Array.isArray(s.pillars)) state.stages[k].pillars = s.pillars;
          if (typeof s.maoObra === "string" || typeof s.maoObra === "number") state.stages[k].maoObra = s.maoObra;
          if (typeof s.equipamentos === "string") state.stages[k].equipamentos = s.equipamentos;
        }
      });
    }
  } catch(e) {}
}

// ============ HELPERS ============

function normalizeDh(raw) {
  if (!raw) return "";
  let s = String(raw).trim().toUpperCase().replace(/\s+/g, "");
  if (/^\d+$/.test(s)) {
    const n = parseInt(s, 10);
    return "DH-" + (n < 10 ? "0" + n : String(n));
  }
  const m = s.match(/^DH-?(\d+)$/);
  if (m) {
    const n = parseInt(m[1], 10);
    return "DH-" + (n < 10 ? "0" + n : String(n));
  }
  return s;
}

function parsePillarIds(str) {
  if (!str) return [];
  return str.split(/[\s,;]+/).map(x => x.trim().toUpperCase()).filter(x => x.length > 0);
}

function formatPillarCode(raw) {
  const m = String(raw).toUpperCase().match(/^P[-]?(.+)$/);
  return m ? "P-" + m[1] : String(raw);
}

function pad2(n) {
  const v = parseInt(n, 10);
  if (isNaN(v)) return "";
  return v < 10 ? "0" + v : "" + v;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// ============ DH CHIPS (LOCAIS) ============

function renderDhChips() {
  const wrap = document.getElementById("dhChips");
  wrap.innerHTML = "";
  state.commonLocais.forEach(dh => {
    const chip = document.createElement("span");
    chip.className = "dh-chip";
    chip.innerHTML = `
      <span class="dh-dot" style="background:${getDhColor(dh)}"></span>
      <span>${escapeHtml(dh)}</span>
      <span class="rm" title="Remover">×</span>
    `;
    chip.querySelector(".rm").addEventListener("click", () => {
      state.commonLocais = state.commonLocais.filter(x => x !== dh);
      // Limpa pilares com DH removido
      STAGES.forEach(s => {
        state.stages[s.key].pillars.forEach(p => { if (p.dh === dh) p.dh = ""; });
      });
      renderDhChips();
      STAGES.forEach(s => renderPillarChips(s.key));
      saveState();
    });
    wrap.appendChild(chip);
  });
}

function addCustomDh() {
  const input = document.getElementById("newDhInput");
  const normalized = normalizeDh(input.value);
  if (!normalized) { showToast("Informe um DH válido", "error"); return; }
  if (state.commonLocais.includes(normalized)) {
    showToast("DH já está na lista", "error");
    return;
  }
  state.commonLocais.push(normalized);
  input.value = "";
  renderDhChips();
  STAGES.forEach(s => renderPillarChips(s.key));
  saveState();
  showToast(`✓ ${normalized} adicionado`, "success");
}

document.getElementById("newDhInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); addCustomDh(); }
});

function normalizeId(raw) {
  if (!raw) return null;
  const s = String(raw).trim().toUpperCase();
  const m = s.match(/^P-?(\d+[A-Z]?)$/);
  return m ? "P" + m[1] : null;
}

function getSuggestions(query, stageKey) {
  if (!query) return [];
  const q = String(query).trim().toUpperCase().replace(/-/g, "");
  if (!q || /[\s,;]/.test(q)) return [];
  const exclude = new Set(state.stages[stageKey].pillars.map(p => p.id));
  return FOUNDATION_IDS
    .filter(id => !exclude.has(id))
    .filter(id => id.startsWith(q))
    .sort((a, b) => {
      const na = parseInt(a.replace(/[^\d]/g, ""), 10) || 0;
      const nb = parseInt(b.replace(/[^\d]/g, ""), 10) || 0;
      return na - nb;
    })
    .slice(0, 8);
}

function addPillarToStage(stageKey, id) {
  if (!id) return false;
  if (state.stages[stageKey].pillars.find(p => p.id === id)) return false;
  // Auto-atribui DH do mapeamento, se estiver na lista comum
  let dh = DH_MAP[id] || "";
  if (dh && !state.commonLocais.includes(dh)) dh = "";
  // Se não houver mapeamento e só houver um local comum, usa ele
  if (!dh && state.commonLocais.length === 1) dh = state.commonLocais[0];
  state.stages[stageKey].pillars.push({ id, dh, status: "ok" });
  return true;
}

function renderSuggestions(stageKey) {
  const wrap = document.getElementById(`sugg-${stageKey}`);
  const input = document.getElementById(`ta-${stageKey}`);
  if (!wrap || !input) return;
  const q = input.value;
  const isBulk = /[\s,;]/.test(q);

  if (!q.trim() || isBulk) {
    wrap.style.display = "none";
    wrap.innerHTML = "";
    return;
  }
  const suggestions = getSuggestions(q, stageKey);
  if (suggestions.length === 0) {
    wrap.innerHTML = `<div class="empty">Nenhuma fundação encontrada</div>`;
    wrap.style.display = "";
    return;
  }
  wrap.innerHTML = "";
  suggestions.forEach(id => {
    const btn = document.createElement("button");
    btn.type = "button";
    const dh = DH_MAP[id];
    const tag = dh
      ? `<span class="dh-tag" style="background:${getDhColor(dh)}">${escapeHtml(dh)}</span>`
      : `<span class="dh-tag" style="background:#A8A39A">— DH —</span>`;
    btn.innerHTML = `<span>${escapeHtml(formatPillarCode(id))}</span>${tag}`;
    // mousedown/touchstart to fire before blur
    btn.addEventListener("mousedown", e => { e.preventDefault(); pickSuggestion(stageKey, id); });
    btn.addEventListener("touchstart", e => { e.preventDefault(); pickSuggestion(stageKey, id); }, { passive: false });
    wrap.appendChild(btn);
  });
  wrap.style.display = "";
}

function pickSuggestion(stageKey, id) {
  if (addPillarToStage(stageKey, id)) {
    const input = document.getElementById(`ta-${stageKey}`);
    input.value = "";
    document.getElementById(`sugg-${stageKey}`).style.display = "none";
    renderPillarChips(stageKey);
    updateSummary();
    saveState();
    input.focus();
  }
}

function handleSearchInput(stageKey) {
  renderSuggestions(stageKey);
}

function handleSearchKeydown(stageKey, ev) {
  if (ev.key === "Enter") {
    ev.preventDefault();
    const input = document.getElementById(`ta-${stageKey}`);
    const q = input.value;
    if (/[\s,;]/.test(q)) {
      // Modo lote
      const tokens = parsePillarIds(q);
      let added = 0, invalid = 0, dup = 0;
      tokens.forEach(t => {
        const norm = normalizeId(t);
        if (!norm || !FOUNDATION_IDS.includes(norm)) { invalid++; return; }
        if (addPillarToStage(stageKey, norm)) added++; else dup++;
      });
      input.value = "";
      document.getElementById(`sugg-${stageKey}`).style.display = "none";
      renderPillarChips(stageKey);
      updateSummary();
      saveState();
      let msg = `✓ ${added} adicionado(s)`;
      if (invalid > 0) msg += ` · ${invalid} inválido(s)`;
      if (dup > 0) msg += ` · ${dup} duplicado(s)`;
      showToast(msg, added > 0 ? "success" : "error");
    } else {
      // Modo único
      const norm = normalizeId(q);
      const sugg = getSuggestions(q, stageKey);
      if (norm && FOUNDATION_IDS.includes(norm)) {
        pickSuggestion(stageKey, norm);
      } else if (sugg.length > 0) {
        pickSuggestion(stageKey, sugg[0]);
      } else if (q.trim()) {
        showToast(`"${q.trim()}" não está na lista`, "error");
      }
    }
  } else if (ev.key === "Escape") {
    document.getElementById(`sugg-${stageKey}`).style.display = "none";
  }
}

function handleSearchFocus(stageKey) {
  renderSuggestions(stageKey);
}

function handleSearchBlur(stageKey) {
  setTimeout(() => {
    const wrap = document.getElementById(`sugg-${stageKey}`);
    if (wrap) wrap.style.display = "none";
  }, 200);
}

// Função compatível pro submitForm e openPreview (não há mais textarea pendente)
function commitTextarea(stageKey) { /* no-op */ }

function renderPillarChips(stageKey) {
  const wrap = document.getElementById(`chips-${stageKey}`);
  if (!wrap) return;
  wrap.innerHTML = "";
  const pillars = state.stages[stageKey].pillars;
  pillars.forEach(p => {
    const chip = document.createElement("span");
    const cls = !p.dh ? "unassigned" : (p.status === "ok" ? "done" : "partial");
    chip.className = "fchip " + cls;

    const statusPid = document.createElement("span");
    statusPid.className = "status-pid";
    statusPid.title = "Tocar para alternar concluído/em andamento";
    statusPid.innerHTML = `<span class="stat">${p.status === "ok" ? "✅" : "🚶‍♂️"}</span><span>${escapeHtml(formatPillarCode(p.id))}</span>`;
    statusPid.addEventListener("click", () => {
      p.status = (p.status === "ok") ? "wip" : "ok";
      renderPillarChips(stageKey);
      saveState();
    });

    const dhWrap = document.createElement("span");
    dhWrap.className = "dh-wrap";
    const dot = document.createElement("span");
    dot.className = "dh-dot";
    dot.style.background = p.dh ? getDhColor(p.dh) : "var(--inactive)";
    const sel = document.createElement("select");
    sel.title = "Local (DH)";
    const noneOpt = document.createElement("option");
    noneOpt.value = ""; noneOpt.textContent = "— DH —";
    sel.appendChild(noneOpt);
    state.commonLocais.forEach(loc => {
      const o = document.createElement("option");
      o.value = loc; o.textContent = loc;
      if (p.dh === loc) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", e => {
      p.dh = e.target.value;
      renderPillarChips(stageKey);
      saveState();
    });
    dhWrap.append(dot, sel);

    const rm = document.createElement("span");
    rm.className = "rm";
    rm.title = "Remover";
    rm.textContent = "×";
    rm.addEventListener("click", () => {
      state.stages[stageKey].pillars = state.stages[stageKey].pillars.filter(x => x.id !== p.id);
      renderPillarChips(stageKey);
      updateSummary();
      saveState();
    });

    chip.append(statusPid, dhWrap, rm);
    wrap.appendChild(chip);
  });
  // Atualiza o total badge
  const tot = document.getElementById(`total-${stageKey}`);
  if (tot) {
    tot.textContent = pillars.length;
    tot.className = "total" + (pillars.length === 0 ? " zero" : "");
  }
}

function updateSummary() {
  let total = 0;
  STAGES.forEach(s => total += state.stages[s.key].pillars.length);
  document.getElementById("headSubtitle").textContent =
    total === 0 ? "0 pilares marcados" : `${total} pilar${total>1?"es":""} marcado${total>1?"s":""}`;
  document.getElementById("submitBtn").disabled = total === 0 || !WEB_APP_URL;
  document.getElementById("reportBtn").disabled = false; // sempre habilitado (gera report mesmo sem pilares)
  document.getElementById("clearAllBtn").disabled = total === 0 && !state.observacoes.trim();
}

// ============ OBSERVAÇÕES ============

document.getElementById("obsInput").addEventListener("input", e => {
  state.observacoes = e.target.value;
  saveState();
  updateSummary();
});

// ============ DATA ============

document.getElementById("dataExec").addEventListener("change", e => {
  state.data = e.target.value;
  saveState();
});

// ============ CLEAR ALL ============

function clearAll() {
  const hasData = STAGES.some(s => state.stages[s.key].pillars.length > 0) || state.observacoes.trim();
  if (!hasData) return;
  if (!confirm("Apagar todos os pilares, mão de obra, equipamentos e observações?")) return;
  STAGES.forEach(s => {
    state.stages[s.key] = { pillars: [], maoObra: "", equipamentos: "" };
  });
  state.observacoes = "";
  document.getElementById("obsInput").value = "";
  STAGES.forEach(s => {
    renderPillarChips(s.key);
    document.getElementById(`mo-${s.key}`).value = "";
    document.getElementById(`eq-${s.key}`).value = "";
    document.getElementById(`ta-${s.key}`).value = "";
    const sugg = document.getElementById(`sugg-${s.key}`);
    if (sugg) sugg.style.display = "none";
  });
  updateSummary();
  saveState();
}

// ============ SUBMIT TO SPREADSHEET ============

async function submitForm() {
  if (!WEB_APP_URL) { showToast("URL do backend não configurada", "error"); return; }
  STAGES.forEach(s => commitTextarea(s.key));

  if (!state.operador) {
    showToast("Selecione o operador antes de enviar", "error");
    document.getElementById("opCard").classList.add("missing");
    document.getElementById("operatorSelect").focus();
    return;
  }

  // Constrói lancamentos só com IDs por etapa, ignorando status "wip"
  const lancamentos = {};
  let total = 0;
  STAGES.forEach(s => {
    const okIds = state.stages[s.key].pillars.filter(p => p.status === "ok").map(p => p.id);
    lancamentos[s.key] = okIds;
    total += okIds.length;
  });

  if (total === 0) { showToast("Nenhum pilar com status ✅ para enviar", "error"); return; }
  if (!state.data) { showToast("Selecione a data", "error"); return; }

  const btn = document.getElementById("submitBtn");
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Enviando...";

  try {
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "submit",
        data: state.data,
        operador: state.operador,
        lancamentos: lancamentos
      }),
      headers: { "Content-Type": "text/plain;charset=utf-8" },
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Erro desconhecido");
    showToast(`✓ ${total} pilar(es) enviados — aguardando aprovação`, "success");
  } catch (err) {
    showToast("Erro: " + err.message, "error");
  } finally {
    btn.textContent = originalText;
    updateSummary();
  }
}

// ============ REPORT ============

function formatPillarLines(okList, wipList) {
  const all = [
    ...okList.map(p => ({ code: formatPillarCode(p.id), s: "✅" })),
    ...wipList.map(p => ({ code: formatPillarCode(p.id), s: "🚶‍♂️" })),
  ];
  if (all.length === 0) return "";
  const maxLen = Math.max(...all.map(c => c.code.length));
  let out = "";
  for (let i = 0; i < all.length; i += 2) {
    const a = all[i];
    const aStr = a.code.padEnd(maxLen) + " " + a.s;
    if (all[i+1]) {
      const b = all[i+1];
      const bStr = b.code.padEnd(maxLen) + " " + b.s;
      out += aStr + "  " + bStr + "\n";
    } else {
      out += aStr + "\n";
    }
  }
  return out;
}

function generateReport() {
  const dateRaw = state.data || "";
  const dateBR = dateRaw ? dateRaw.split("-").reverse().join("/") : "____";

  const blocks = [];
  blocks.push(`📋REPORT DE PRODUÇÃO - FUNDAÇÕES - ${dateBR}`);

  STAGES.forEach(s => {
    const stageData = state.stages[s.key];
    const stageName = s.bold ? `*${s.label}*` : s.label;
    const header = `${s.emoji} ${stageName}`;

    if (stageData.pillars.length === 0) {
      blocks.push(`${header}\nSem atividade`);
      return;
    }

    // Agrupa por DH na ordem da lista comum
    const groups = {};
    const orderedKeys = [];
    state.commonLocais.forEach(loc => { groups[loc] = { ok: [], wip: [] }; orderedKeys.push(loc); });
    stageData.pillars.forEach(p => {
      const key = p.dh || "(sem local)";
      if (!groups[key]) { groups[key] = { ok: [], wip: [] }; orderedKeys.push(key); }
      if (p.status === "ok") groups[key].ok.push(p);
      else groups[key].wip.push(p);
    });

    const dhBlocks = [];
    orderedKeys.forEach(loc => {
      const g = groups[loc];
      if (!g || (g.ok.length === 0 && g.wip.length === 0)) return;
      const pillarLines = formatPillarLines(g.ok, g.wip).replace(/\n+$/, "");
      dhBlocks.push(`Total: ${pad2(g.ok.length)}\nLocal: ${loc}\n${pillarLines}`);
    });

    const resourceLines = [];
    if (stageData.maoObra !== "" && stageData.maoObra != null) {
      resourceLines.push(`Mão de Obra: ${pad2(stageData.maoObra)}`);
    }
    resourceLines.push(`Equipamentos:`);
    const eq = (stageData.equipamentos || "").trim();
    if (eq) resourceLines.push(eq);

    blocks.push([header, ...dhBlocks, resourceLines.join("\n")].join("\n\n"));
  });

  const obs = (state.observacoes || "").trim();
  blocks.push(`📌 Observações:\n${obs}`);
  return blocks.join("\n\n");
}

function openPreview() {
  STAGES.forEach(s => commitTextarea(s.key));
  const text = generateReport();
  document.getElementById("previewText").value = text;

  let total = 0, withDh = 0, unassigned = 0;
  STAGES.forEach(s => {
    state.stages[s.key].pillars.forEach(p => {
      total++;
      if (p.dh) withDh++;
      else unassigned++;
    });
  });
  const info = document.getElementById("previewInfo");
  const dateBR = state.data ? state.data.split("-").reverse().join("/") : "____";
  info.innerHTML = `<span>${total} pilar(es) · ${withDh} com DH · ${dateBR}</span>` +
    (unassigned > 0 ? `<span class="warn">⚠ ${unassigned} sem DH (irão como "(sem local)")</span>` : "");

  document.getElementById("viewEdit").classList.remove("active");
  document.getElementById("viewPreview").classList.add("active");
}

function closePreview() {
  document.getElementById("viewPreview").classList.remove("active");
  document.getElementById("viewEdit").classList.add("active");
}

async function copyReport() {
  const text = document.getElementById("previewText").value;
  if (!text) { showToast("Nada para copiar", "error"); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast("✓ Report copiado!", "success");
  } catch (err) {
    const ta = document.getElementById("previewText");
    ta.removeAttribute("readonly");
    ta.focus(); ta.select();
    try { document.execCommand("copy"); showToast("✓ Report copiado!", "success"); }
    catch (e2) { showToast("Selecione o texto e copie manualmente", "error"); }
    ta.setAttribute("readonly", "");
  }
}

// ============ TOAST ============

function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (type || "");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.className = "toast", 3500);
}

// ============ OPERADOR ============

function populateOperatorSelect() {
  const sel = document.getElementById("operatorSelect");
  sel.innerHTML = '<option value="">Selecione o operador…</option>';
  OPERATORS.forEach(name => {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    if (name === state.operador) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", e => {
    state.operador = e.target.value;
    document.getElementById("opCard").classList.toggle("missing", !state.operador);
    saveState();
  });
  document.getElementById("opCard").classList.toggle("missing", !state.operador);
}

// ============ ADMIN ============

let adminToken = null;
let adminEmail = null;
let adminItems = [];

function openAdmin() {
  document.getElementById("viewEdit").classList.remove("active");
  document.getElementById("viewAdmin").classList.add("active");
  if (adminToken) {
    refreshPending();
  } else {
    renderAdminLogin();
  }
}

function closeAdmin() {
  document.getElementById("viewAdmin").classList.remove("active");
  document.getElementById("viewEdit").classList.add("active");
}

function renderAdminLogin() {
  const body = document.getElementById("adminBody");
  document.getElementById("adminRefreshBtn").style.display = "none";
  document.getElementById("adminSubtitle").textContent = "Acesso restrito";
  body.innerHTML = `
    <div class="admin-login-card">
      <div class="title">Login necessário</div>
      <div class="help">Apenas administradores autorizados podem aprovar submissões. Faça login com a conta Google cadastrada.</div>
      <div id="googleSignInBtn" class="gbtn"></div>
      ${(OAUTH_CLIENT_ID.indexOf("SEU_CLIENT_ID") === 0)
        ? '<div class="help" style="margin-top:14px;color:var(--danger)">⚠ OAUTH_CLIENT_ID não configurado no HTML. Edite a constante no início do script.</div>'
        : ''}
    </div>
  `;
  initGoogleSignIn();
}

function initGoogleSignIn() {
  const btnEl = document.getElementById("googleSignInBtn");
  if (!btnEl) return;
  if (typeof google === "undefined" || !google.accounts || !google.accounts.id) {
    setTimeout(initGoogleSignIn, 300);
    return;
  }
  if (OAUTH_CLIENT_ID.indexOf("SEU_CLIENT_ID") === 0) return;
  try {
    google.accounts.id.initialize({
      client_id: OAUTH_CLIENT_ID,
      callback: handleCredentialResponse,
      auto_select: false,
      use_fedcm_for_prompt: true,
    });
    google.accounts.id.renderButton(btnEl, {
      theme: "filled_black",
      size: "large",
      text: "signin_with",
      width: 280,
    });
  } catch (err) {
    console.warn("Google Sign-In init failed:", err);
  }
}

function handleCredentialResponse(response) {
  adminToken = response.credential;
  try {
    const parts = adminToken.split(".");
    const decoded = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
    adminEmail = decoded.email;
  } catch(e) {}
  refreshPending();
}

function logoutAdmin() {
  adminToken = null;
  adminEmail = null;
  adminItems = [];
  if (typeof google !== "undefined" && google.accounts && google.accounts.id) {
    google.accounts.id.disableAutoSelect();
  }
  renderAdminLogin();
}

async function refreshPending() {
  if (!adminToken) { renderAdminLogin(); return; }
  const body = document.getElementById("adminBody");
  body.innerHTML = `<div class="admin-empty">Carregando…</div>`;
  document.getElementById("adminRefreshBtn").style.display = "";

  try {
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "list_pending", idToken: adminToken }),
      headers: { "Content-Type": "text/plain;charset=utf-8" },
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Erro desconhecido");
    adminEmail = json.admin;
    adminItems = json.items || [];
    renderAdminList();
  } catch (err) {
    showToast("Erro: " + err.message, "error");
    if (/token|autoriz|expirad/i.test(err.message)) {
      adminToken = null;
      renderAdminLogin();
    } else {
      const body = document.getElementById("adminBody");
      body.innerHTML = `<div class="admin-empty">Erro ao carregar: ${escapeHtml(err.message)}</div>`;
    }
  }
}

function renderAdminList() {
  const body = document.getElementById("adminBody");
  document.getElementById("adminSubtitle").textContent =
    adminItems.length === 0 ? "Nenhuma pendência" : `${adminItems.length} pendente${adminItems.length>1?"s":""}`;

  let html = `
    <div class="admin-user">
      <span class="who">${escapeHtml(adminEmail || "")}</span>
      <button type="button" onclick="logoutAdmin()">Sair</button>
    </div>
  `;
  if (adminItems.length === 0) {
    html += `<div class="admin-empty">Nenhuma submissão pendente.</div>`;
  } else {
    adminItems.forEach((item, idx) => {
      const dateBR = item.data ? item.data.split("-").reverse().join("/") : item.data;
      const ts = item.timestamp ? new Date(item.timestamp).toLocaleString("pt-BR") : "";
      const detailLines = [];
      Object.keys(item.payload || {}).forEach(stageKey => {
        const arr = item.payload[stageKey] || [];
        if (arr.length === 0) return;
        const stageInfo = STAGE_REPORT_INFO[stageKey];
        const label = stageInfo ? stageInfo.label : stageKey;
        detailLines.push(`<div class="stage-line"><span class="stage-label">${escapeHtml(label)}</span> (${arr.length}): ${escapeHtml(arr.map(id => formatPillarCode(id)).join(", "))}</div>`);
      });
      html += `
        <div class="admin-item" data-id="${escapeHtml(item.id)}">
          <div class="ai-head">
            <span class="ai-date">${escapeHtml(dateBR)}</span>
            <span class="ai-op">${escapeHtml(item.operador)}</span>
            <span class="ai-time">${escapeHtml(ts)}</span>
          </div>
          <div class="ai-body">
            <div class="ai-resumo"><span class="ai-total">${item.total} pilar(es)</span> — ${escapeHtml(item.resumo)}</div>
            <button type="button" class="ai-detail-toggle" onclick="toggleDetail(${idx})">Ver pilares ▼</button>
            <div class="ai-detail" id="ai-detail-${idx}">${detailLines.join("")}</div>
          </div>
          <div class="ai-actions">
            <button type="button" class="ai-reject" onclick="confirmReject('${escapeHtml(item.id)}')">Rejeitar</button>
            <button type="button" class="ai-approve" onclick="confirmApprove('${escapeHtml(item.id)}')">Aprovar</button>
          </div>
        </div>
      `;
    });
  }
  body.innerHTML = html;
}

function toggleDetail(idx) {
  const el = document.getElementById(`ai-detail-${idx}`);
  if (el) el.classList.toggle("open");
}

async function confirmApprove(id) {
  if (!confirm("Aprovar esta submissão? Os pilares irão para a aba LANÇAMENTO.")) return;
  await processAdminAction("approve", id, "");
}

async function confirmReject(id) {
  const obs = prompt("Motivo da rejeição (opcional):");
  if (obs === null) return; // cancelado
  await processAdminAction("reject", id, obs || "");
}

async function processAdminAction(action, id, observacao) {
  if (!adminToken) { showToast("Sessão expirada, faça login novamente", "error"); renderAdminLogin(); return; }
  try {
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action, idToken: adminToken, id, observacao }),
      headers: { "Content-Type": "text/plain;charset=utf-8" },
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Erro");
    showToast(action === "approve" ? "✓ Aprovado" : "✓ Rejeitado", "success");
    await refreshPending();
  } catch (err) {
    showToast("Erro: " + err.message, "error");
    if (/token|autoriz|expirad/i.test(err.message)) {
      adminToken = null;
      renderAdminLogin();
    }
  }
}

// ============ INIT ============

loadState();
document.getElementById("dataExec").value = state.data;
document.getElementById("obsInput").value = state.observacoes;
if (!WEB_APP_URL) {
  document.getElementById("statusbar").className = "statusbar warn";
  document.getElementById("statusLabel").textContent = "Planilha não configurada";
  document.getElementById("statusMeta").textContent = "";
}
renderDhChips();
buildStageCards();
populateOperatorSelect();
STAGES.forEach(s => renderPillarChips(s.key));
updateSummary();

// ============ PWA — Service Worker ============
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(reg => console.log("SW registrado:", reg.scope))
      .catch(err => console.warn("SW falhou:", err));
  });
}
