<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1B5E20">
<title>Apontamento de Datas — DC Pecém / SS&amp;B</title>
<style>
:root {
  --green-900: #1B5E20;
  --green-700: #2E7D32;
  --green-500: #4CAF50;
  --green-50:  #E8F5E9;
  --green-100: #C8E6C9;
  --gray-50:  #FAFAFA;
  --gray-100: #F5F5F5;
  --gray-200: #EEEEEE;
  --gray-300: #E0E0E0;
  --gray-500: #9E9E9E;
  --gray-700: #424242;
  --gray-900: #212121;
  --red:   #C62828;
  --amber: #F57F17;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--gray-100);
  color: var(--gray-900);
  font-size: 16px;
  line-height: 1.5;
  padding-bottom: 100px;
}
.header {
  background: var(--green-900);
  color: white;
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: var(--shadow);
}
.header h1 { font-size: 18px; font-weight: 600; }
.header .sub { font-size: 13px; opacity: 0.85; margin-top: 2px; }

.container { max-width: 700px; margin: 0 auto; padding: 16px; }

.card {
  background: white;
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

.field-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray-700);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.date-input {
  width: 100%;
  font-size: 18px;
  font-weight: 500;
  padding: 14px;
  border: 2px solid var(--gray-300);
  border-radius: 8px;
  background: white;
  color: var(--gray-900);
}
.date-input:focus { outline: none; border-color: var(--green-700); }

.stage-card {
  background: white;
  border-radius: var(--radius);
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.stage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--green-50);
  border-bottom: 1px solid var(--green-100);
}
.stage-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--green-900);
  letter-spacing: 0.3px;
}
.stage-count {
  background: var(--green-700);
  color: white;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  min-width: 28px;
  text-align: center;
}
.stage-count.zero { background: var(--gray-300); color: var(--gray-700); }
.stage-body { padding: 12px 16px; }

.pillar-textarea {
  width: 100%;
  min-height: 56px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 15px;
  padding: 10px 12px;
  border: 2px solid var(--gray-300);
  border-radius: 8px;
  background: white;
  resize: vertical;
}
.pillar-textarea:focus { outline: none; border-color: var(--green-700); }
.pillar-help {
  font-size: 12px;
  color: var(--gray-500);
  margin-top: 4px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--green-100);
  color: var(--green-900);
  padding: 6px 10px;
  border-radius: 999px;
  font-family: "SF Mono", Menlo, monospace;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.chip:active { background: var(--green-50); }
.chip .x {
  background: var(--green-700);
  color: white;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
}
.chip.invalid { background: #FFEBEE; color: var(--red); }
.chip.invalid .x { background: var(--red); }

.stage-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.clear-btn {
  background: none;
  border: 1px solid var(--gray-300);
  color: var(--gray-700);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.clear-btn:active { background: var(--gray-100); }

.submit-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
  z-index: 10;
}
.submit-bar-inner {
  max-width: 700px;
  margin: 0 auto;
  display: flex;
  gap: 12px;
  align-items: center;
}
.submit-btn {
  flex: 1;
  background: var(--green-700);
  color: white;
  border: none;
  padding: 16px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: background 0.15s;
}
.submit-btn:active { background: var(--green-900); }
.submit-btn:disabled { background: var(--gray-300); cursor: not-allowed; }
.submit-summary { font-size: 13px; color: var(--gray-700); white-space: nowrap; }

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--gray-900);
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s;
  z-index: 100;
  max-width: 90vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--green-700); }
.toast.error   { background: var(--red); }

.config-banner {
  background: var(--amber);
  color: white;
  padding: 12px 16px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
}
</style>
</head>
<body>

<div id="configBanner" class="config-banner" style="display:none">
  ⚠ Configure a URL do backend no início do arquivo (constante WEB_APP_URL)
</div>

<div class="header">
  <h1>Apontamento de Datas — Fundações</h1>
  <div class="sub">DC Pecém · SS&amp;B Construtora</div>
</div>

<div class="container">

  <div class="card">
    <label class="field-label" for="dataExec">Data de Execução</label>
    <input type="date" id="dataExec" class="date-input">
  </div>

  <div id="stages"></div>

</div>

<div class="submit-bar">
  <div class="submit-bar-inner">
    <span class="submit-summary" id="summary">Nenhum pilar adicionado</span>
    <button id="submitBtn" class="submit-btn" onclick="submitForm()" disabled>Enviar</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============ CONFIG ============
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyl11sxsSfroQmMldWg9AUi09jOQzpbbSerK2f9osmd5AWiHoUYEqV5oTZQALMiU8aq1w/exec"; // ⚠ Cole aqui a URL do Apps Script após o deploy
// ================================

const STAGES = [
  { key: "ESCAVACAO",   label: "ESCAVAÇÃO" },
  { key: "MAGRO",       label: "MAGRO" },
  { key: "ARMADURA",    label: "ARMADURA" },
  { key: "FORMAS",      label: "FORMAS" },
  { key: "CONCRETAGEM", label: "CONCRETAGEM" },
  { key: "REATERRO",    label: "REATERRO" },
  { key: "REATERRO_T",  label: "REATERRO_T" },
];

const state = {
  data: new Date().toISOString().slice(0,10),
  lancamentos: {},
};
STAGES.forEach(s => state.lancamentos[s.key] = []);

const STORAGE_KEY = "apontamento_datas_v1";
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    Object.keys(saved.lancamentos || {}).forEach(k => {
      if (state.lancamentos[k] !== undefined) {
        state.lancamentos[k] = saved.lancamentos[k] || [];
      }
    });
  } catch(e) {}
}

document.getElementById("dataExec").value = state.data;
document.getElementById("dataExec").addEventListener("change", e => {
  state.data = e.target.value;
  saveState();
});

if (!WEB_APP_URL) {
  document.getElementById("configBanner").style.display = "block";
}

const stagesEl = document.getElementById("stages");
STAGES.forEach(s => {
  const card = document.createElement("div");
  card.className = "stage-card";
  card.innerHTML = `
    <div class="stage-header">
      <span class="stage-name">${s.label}</span>
      <span class="stage-count zero" id="count-${s.key}">0</span>
    </div>
    <div class="stage-body">
      <textarea class="pillar-textarea" id="ta-${s.key}" placeholder="Ex: P543, P544 P545" autocapitalize="characters" autocomplete="off" spellcheck="false"></textarea>
      <div class="pillar-help">Separe IDs por vírgula, espaço, ponto e vírgula ou linha. Toque no chip para remover.</div>
      <div class="chips" id="chips-${s.key}"></div>
      <div class="stage-actions">
        <button type="button" class="clear-btn" onclick="clearStage('${s.key}')">Limpar etapa</button>
      </div>
    </div>
  `;
  stagesEl.appendChild(card);

  const ta = card.querySelector(`#ta-${s.key}`);
  ta.addEventListener("input", () => parseTextareaLive(s.key));
  ta.addEventListener("blur", () => commitTextarea(s.key));
});

function parsePillarIds(str) {
  if (!str) return [];
  return str.split(/[\s,;]+/).map(x => x.trim().toUpperCase()).filter(x => x.length > 0);
}

function parseTextareaLive(stageKey) {
  const ta = document.getElementById(`ta-${stageKey}`);
  if (/[\s,;\n]$/.test(ta.value)) commitTextarea(stageKey);
}

function commitTextarea(stageKey) {
  const ta = document.getElementById(`ta-${stageKey}`);
  const ids = parsePillarIds(ta.value);
  if (ids.length === 0) return;
  const existing = new Set(state.lancamentos[stageKey]);
  ids.forEach(id => existing.add(id));
  state.lancamentos[stageKey] = Array.from(existing);
  ta.value = "";
  renderChips(stageKey);
  updateSummary();
  saveState();
}

function renderChips(stageKey) {
  const wrap = document.getElementById(`chips-${stageKey}`);
  const ids = state.lancamentos[stageKey];
  wrap.innerHTML = "";
  ids.forEach(id => {
    const chip = document.createElement("span");
    const isValid = /^P[\d]+/.test(id);
    chip.className = "chip" + (isValid ? "" : " invalid");
    chip.innerHTML = `${id}<span class="x">×</span>`;
    chip.addEventListener("click", () => {
      state.lancamentos[stageKey] = state.lancamentos[stageKey].filter(x => x !== id);
      renderChips(stageKey);
      updateSummary();
      saveState();
    });
    wrap.appendChild(chip);
  });
  const count = document.getElementById(`count-${stageKey}`);
  count.textContent = ids.length;
  count.className = "stage-count" + (ids.length === 0 ? " zero" : "");
}

function clearStage(stageKey) {
  if (state.lancamentos[stageKey].length === 0) return;
  if (!confirm(`Limpar todos os pilares de ${stageKey}?`)) return;
  state.lancamentos[stageKey] = [];
  renderChips(stageKey);
  updateSummary();
  saveState();
}

function updateSummary() {
  let total = 0, stagesWithData = 0;
  Object.keys(state.lancamentos).forEach(k => {
    const n = state.lancamentos[k].length;
    total += n;
    if (n > 0) stagesWithData++;
  });
  const sum = document.getElementById("summary");
  const btn = document.getElementById("submitBtn");
  if (total === 0) {
    sum.textContent = "Nenhum pilar adicionado";
    btn.disabled = true;
  } else {
    sum.textContent = `${total} pilar${total>1?"es":""} · ${stagesWithData} etapa${stagesWithData>1?"s":""}`;
    btn.disabled = false;
  }
}

function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (type || "");
  setTimeout(() => t.className = "toast", 3500);
}

async function submitForm() {
  if (!WEB_APP_URL) {
    showToast("Configure a URL do backend (WEB_APP_URL) primeiro", "error");
    return;
  }

  // Garante que o conteúdo pendente nos textareas seja capturado
  STAGES.forEach(s => commitTextarea(s.key));

  let total = 0;
  Object.keys(state.lancamentos).forEach(k => total += state.lancamentos[k].length);
  if (total === 0) {
    showToast("Adicione ao menos um pilar antes de enviar", "error");
    return;
  }
  if (!state.data) {
    showToast("Selecione a data de execução", "error");
    return;
  }

  const btn = document.getElementById("submitBtn");
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Enviando...";

  try {
    const payload = { data: state.data, lancamentos: state.lancamentos };
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload),
      headers: { "Content-Type": "text/plain;charset=utf-8" },
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Erro desconhecido");

    showToast(`✓ Salvos ${json.totalInserted} pilares`, "success");

    STAGES.forEach(s => state.lancamentos[s.key] = []);
    STAGES.forEach(s => renderChips(s.key));
    saveState();
  } catch (err) {
    showToast("Erro ao enviar: " + err.message, "error");
  } finally {
    btn.textContent = originalText;
    updateSummary();
  }
}

loadState();
STAGES.forEach(s => renderChips(s.key));
updateSummary();
</script>
</body>
</html>
