<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1B5E20">
<title>Apontamento de Datas — DC Pecém / SS&amp;B</title>
<style>
:root {
  --green-900: #1B5E20;
  --green-700: #2E7D32;
  --green-500: #4CAF50;
  --green-50:  #E8F5E9;
  --green-100: #C8E6C9;
  --gray-50:  #FAFAFA;
  --gray-100: #F5F5F5;
  --gray-200: #EEEEEE;
  --gray-300: #E0E0E0;
  --gray-500: #9E9E9E;
  --gray-700: #424242;
  --gray-900: #212121;
  --red:   #C62828;
  --amber: #F57F17;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--gray-100);
  color: var(--gray-900);
  font-size: 16px;
  line-height: 1.5;
  padding-bottom: 100px;
}
.header {
  background: var(--green-900);
  color: white;
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: var(--shadow);
}
.header h1 { font-size: 18px; font-weight: 600; }
.header .sub { font-size: 13px; opacity: 0.85; margin-top: 2px; }

.container { max-width: 700px; margin: 0 auto; padding: 16px; }

.card {
  background: white;
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

.field-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray-700);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.date-input {
  width: 100%;
  font-size: 18px;
  font-weight: 500;
  padding: 14px;
  border: 2px solid var(--gray-300);
  border-radius: 8px;
  background: white;
  color: var(--gray-900);
}
.date-input:focus { outline: none; border-color: var(--green-700); }

.stage-card {
  background: white;
  border-radius: var(--radius);
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.stage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--green-50);
  border-bottom: 1px solid var(--green-100);
}
.stage-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--green-900);
  letter-spacing: 0.3px;
}
.stage-count {
  background: var(--green-700);
  color: white;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  min-width: 28px;
  text-align: center;
}
.stage-count.zero { background: var(--gray-300); color: var(--gray-700); }
.stage-body { padding: 12px 16px; }

.pillar-textarea {
  width: 100%;
  min-height: 56px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 15px;
  padding: 10px 12px;
  border: 2px solid var(--gray-300);
  border-radius: 8px;
  background: white;
  resize: vertical;
}
.pillar-textarea:focus { outline: none; border-color: var(--green-700); }
.pillar-help {
  font-size: 12px;
  color: var(--gray-500);
  margin-top: 4px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--green-100);
  color: var(--green-900);
  padding: 6px 10px;
  border-radius: 999px;
  font-family: "SF Mono", Menlo, monospace;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
}
.chip:active { background: var(--green-50); }
.chip .x {
  background: var(--green-700);
  color: white;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
}
.chip.invalid { background: #FFEBEE; color: var(--red); }
.chip.invalid .x { background: var(--red); }

.stage-actions { display: flex; gap: 8px; margin-top: 10px; }
.clear-btn {
  background: none;
  border: 1px solid var(--gray-300);
  color: var(--gray-700);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.clear-btn:active { background: var(--gray-100); }

.submit-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: white;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
  z-index: 10;
}
.submit-bar-inner {
  max-width: 700px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
  align-items: center;
}
.submit-summary {
  font-size: 12px;
  color: var(--gray-700);
  white-space: nowrap;
  flex: 0 0 auto;
}
.report-btn, .submit-btn {
  border: none;
  padding: 14px 12px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
  cursor: pointer;
}
.report-btn {
  background: white;
  color: var(--green-900);
  border: 2px solid var(--green-700);
  flex: 0 0 auto;
}
.report-btn:active { background: var(--green-50); }
.report-btn:disabled { color: var(--gray-500); border-color: var(--gray-300); cursor: not-allowed; }
.submit-btn { flex: 1; background: var(--green-700); color: white; }
.submit-btn:active { background: var(--green-900); }
.submit-btn:disabled { background: var(--gray-300); cursor: not-allowed; }

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--gray-900);
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s;
  z-index: 1100;
  max-width: 90vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--green-700); }
.toast.error   { background: var(--red); }

.config-banner {
  background: var(--amber);
  color: white;
  padding: 12px 16px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
}

/* === MODAL DO REPORT === */
.modal {
  position: fixed;
  inset: 0;
  background: var(--gray-100);
  z-index: 1000;
  display: none;
  flex-direction: column;
}
.modal.show { display: flex; }
.modal-header {
  background: var(--green-900);
  color: white;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.modal-header h2 { font-size: 17px; font-weight: 600; }
.modal-header .close-btn {
  background: none; border: none; color: white;
  font-size: 28px; cursor: pointer; padding: 0 8px; line-height: 1;
}
.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}
.modal-footer {
  background: white;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
  display: flex;
  gap: 10px;
}
.modal-footer button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.copy-btn { background: var(--green-700); color: white; }
.copy-btn:active { background: var(--green-900); }
.back-btn { background: var(--gray-200); color: var(--gray-900); }
.back-btn:active { background: var(--gray-300); }

.report-stage {
  background: white;
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.report-stage h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--green-900);
  margin-bottom: 4px;
}
.stage-total-hint {
  font-size: 12px;
  color: var(--gray-500);
  margin-bottom: 8px;
}
.report-stage label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-700);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 10px 0 4px;
}
.report-stage input[type="text"],
.report-stage input[type="number"],
.report-stage textarea {
  width: 100%;
  font-size: 15px;
  padding: 8px 10px;
  border: 1.5px solid var(--gray-300);
  border-radius: 6px;
  font-family: inherit;
  background: white;
}
.report-stage input:focus,
.report-stage textarea:focus { outline: none; border-color: var(--green-700); }
.report-stage textarea {
  font-family: "SF Mono", Menlo, monospace;
  resize: vertical;
  min-height: 60px;
}

.report-pillars {
  border: 1px solid var(--gray-200);
  border-radius: 6px;
  margin-top: 6px;
  max-height: 260px;
  overflow-y: auto;
}
.report-pillar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--gray-200);
}
.report-pillar-row:last-child { border-bottom: none; }
.report-pillar-row.unassigned { background: #FFF8E1; }
.rp-id {
  flex: 1;
  font-family: "SF Mono", monospace;
  font-size: 14px;
  font-weight: 600;
  color: var(--gray-900);
}
.rp-dh {
  padding: 6px 8px;
  border: 1.5px solid var(--gray-300);
  border-radius: 6px;
  font-size: 13px;
  background: white;
  min-width: 88px;
  font-family: inherit;
}
.rp-status {
  background: none;
  border: 1.5px solid var(--gray-300);
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 18px;
  cursor: pointer;
  line-height: 1.4;
}
.rp-status:active { background: var(--gray-100); }

.preview-card {
  background: white;
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}
.preview-card h3 {
  font-size: 13px;
  color: var(--gray-700);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 700;
  margin-bottom: 8px;
}
#preview {
  width: 100%;
  min-height: 220px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
  padding: 10px;
  border: 1px solid var(--gray-300);
  border-radius: 6px;
  background: var(--gray-50);
  resize: vertical;
  white-space: pre;
  overflow: auto;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--gray-500);
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}
</style>
</head>
<body>

<div id="configBanner" class="config-banner" style="display:none">
  ⚠ Configure a URL do backend no início do arquivo (constante WEB_APP_URL)
</div>

<div class="header">
  <h1>Apontamento de Datas — Fundações</h1>
  <div class="sub">DC Pecém · SS&amp;B Construtora</div>
</div>

<div class="container">
  <div class="card">
    <label class="field-label" for="dataExec">Data de Execução</label>
    <input type="date" id="dataExec" class="date-input">
  </div>
  <div id="stages"></div>
</div>

<div class="submit-bar">
  <div class="submit-bar-inner">
    <span class="submit-summary" id="summary">Nenhum pilar adicionado</span>
    <button id="reportBtn" class="report-btn" onclick="openReport()" disabled>📋 Report</button>
    <button id="submitBtn" class="submit-btn" onclick="submitForm()" disabled>Enviar</button>
  </div>
</div>

<!-- MODAL DO REPORT -->
<div id="reportModal" class="modal">
  <div class="modal-header">
    <h2>Report de Produção</h2>
    <button class="close-btn" onclick="closeReport()" aria-label="Fechar">×</button>
  </div>
  <div class="modal-body">
    <div id="reportStages"></div>
    <div class="report-stage">
      <h3>📌 Observações</h3>
      <textarea id="obsInput" rows="3" placeholder="Observações gerais do dia (opcional)"></textarea>
    </div>
    <div class="preview-card">
      <h3>Prévia do Report</h3>
      <textarea id="preview" readonly></textarea>
    </div>
  </div>
  <div class="modal-footer">
    <button class="back-btn" onclick="closeReport()">Voltar</button>
    <button class="copy-btn" onclick="copyReport()">📋 Copiar Report</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============ CONFIG ============
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyl11sxsSfroQmMldWg9AUi09jOQzpbbSerK2f9osmd5AWiHoUYEqV5oTZQALMiU8aq1w/exec";
// ================================

const STAGES = [
  { key: "ESCAVACAO",   label: "ESCAVAÇÃO" },
  { key: "MAGRO",       label: "MAGRO" },
  { key: "ARMADURA",    label: "ARMADURA" },
  { key: "FORMAS",      label: "FORMAS" },
  { key: "CONCRETAGEM", label: "CONCRETAGEM" },
  { key: "REATERRO",    label: "REATERRO" },
  { key: "REATERRO_T",  label: "REATERRO_T" },
];

const STAGE_REPORT_INFO = {
  ESCAVACAO:   { emoji: "🕳️", label: "Escavação",                       bold: false },
  MAGRO:       { emoji: "💿", label: "Magro",                            bold: false },
  ARMADURA:    { emoji: "🕸️", label: "Armação",                          bold: true  },
  FORMAS:      { emoji: "🏟️", label: "Mont. de Forma",                   bold: true  },
  CONCRETAGEM: { emoji: "🗻", label: "Concretagem",                      bold: false },
  REATERRO:    { emoji: "🌱", label: "Reaterro – (SSB)",                 bold: false },
  REATERRO_T:  { emoji: "🌱", label: "Reaterro – (ServObra - Terceiro)", bold: false },
};

const state = {
  data: new Date().toISOString().slice(0,10),
  lancamentos: {},
};
STAGES.forEach(s => state.lancamentos[s.key] = []);

const reportState = {
  stages: {},
  observacoes: "",
};

const STORAGE_KEY = "apontamento_datas_v1";
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    Object.keys(saved.lancamentos || {}).forEach(k => {
      if (state.lancamentos[k] !== undefined) {
        state.lancamentos[k] = saved.lancamentos[k] || [];
      }
    });
  } catch(e) {}
}

document.getElementById("dataExec").value = state.data;
document.getElementById("dataExec").addEventListener("change", e => {
  state.data = e.target.value;
  saveState();
  if (document.getElementById("reportModal").classList.contains("show")) renderPreview();
});

if (!WEB_APP_URL) document.getElementById("configBanner").style.display = "block";

const stagesEl = document.getElementById("stages");
STAGES.forEach(s => {
  const card = document.createElement("div");
  card.className = "stage-card";
  card.innerHTML = `
    <div class="stage-header">
      <span class="stage-name">${s.label}</span>
      <span class="stage-count zero" id="count-${s.key}">0</span>
    </div>
    <div class="stage-body">
      <textarea class="pillar-textarea" id="ta-${s.key}" placeholder="Ex: P543, P544 P545" autocapitalize="characters" autocomplete="off" spellcheck="false"></textarea>
      <div class="pillar-help">Separe IDs por vírgula, espaço, ponto e vírgula ou linha. Toque no chip para remover.</div>
      <div class="chips" id="chips-${s.key}"></div>
      <div class="stage-actions">
        <button type="button" class="clear-btn" onclick="clearStage('${s.key}')">Limpar etapa</button>
      </div>
    </div>
  `;
  stagesEl.appendChild(card);
  const ta = card.querySelector(`#ta-${s.key}`);
  ta.addEventListener("input", () => parseTextareaLive(s.key));
  ta.addEventListener("blur", () => commitTextarea(s.key));
});

function parsePillarIds(str) {
  if (!str) return [];
  return str.split(/[\s,;]+/).map(x => x.trim().toUpperCase()).filter(x => x.length > 0);
}
function parseTextareaLive(stageKey) {
  const ta = document.getElementById(`ta-${stageKey}`);
  if (/[\s,;\n]$/.test(ta.value)) commitTextarea(stageKey);
}
function commitTextarea(stageKey) {
  const ta = document.getElementById(`ta-${stageKey}`);
  const ids = parsePillarIds(ta.value);
  if (ids.length === 0) return;
  const existing = new Set(state.lancamentos[stageKey]);
  ids.forEach(id => existing.add(id));
  state.lancamentos[stageKey] = Array.from(existing);
  ta.value = "";
  renderChips(stageKey);
  updateSummary();
  saveState();
}
function renderChips(stageKey) {
  const wrap = document.getElementById(`chips-${stageKey}`);
  const ids = state.lancamentos[stageKey];
  wrap.innerHTML = "";
  ids.forEach(id => {
    const chip = document.createElement("span");
    const isValid = /^P[\d]+/.test(id);
    chip.className = "chip" + (isValid ? "" : " invalid");
    chip.innerHTML = `${id}<span class="x">×</span>`;
    chip.addEventListener("click", () => {
      state.lancamentos[stageKey] = state.lancamentos[stageKey].filter(x => x !== id);
      renderChips(stageKey);
      updateSummary();
      saveState();
    });
    wrap.appendChild(chip);
  });
  const count = document.getElementById(`count-${stageKey}`);
  count.textContent = ids.length;
  count.className = "stage-count" + (ids.length === 0 ? " zero" : "");
}
function clearStage(stageKey) {
  if (state.lancamentos[stageKey].length === 0) return;
  if (!confirm(`Limpar todos os pilares de ${stageKey}?`)) return;
  state.lancamentos[stageKey] = [];
  renderChips(stageKey);
  updateSummary();
  saveState();
}
function updateSummary() {
  let total = 0, stagesWithData = 0;
  Object.keys(state.lancamentos).forEach(k => {
    const n = state.lancamentos[k].length;
    total += n;
    if (n > 0) stagesWithData++;
  });
  const sum = document.getElementById("summary");
  const submitBtn = document.getElementById("submitBtn");
  const reportBtn = document.getElementById("reportBtn");
  if (total === 0) {
    sum.textContent = "Nenhum pilar adicionado";
    submitBtn.disabled = true;
    reportBtn.disabled = true;
  } else {
    sum.textContent = `${total} pilar${total>1?"es":""} · ${stagesWithData} etapa${stagesWithData>1?"s":""}`;
    submitBtn.disabled = false;
    reportBtn.disabled = false;
  }
}
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (type || "");
  setTimeout(() => t.className = "toast", 3500);
}
async function submitForm() {
  if (!WEB_APP_URL) { showToast("Configure a URL do backend (WEB_APP_URL) primeiro", "error"); return; }
  STAGES.forEach(s => commitTextarea(s.key));
  let total = 0;
  Object.keys(state.lancamentos).forEach(k => total += state.lancamentos[k].length);
  if (total === 0) { showToast("Adicione ao menos um pilar antes de enviar", "error"); return; }
  if (!state.data) { showToast("Selecione a data de execução", "error"); return; }
  const btn = document.getElementById("submitBtn");
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Enviando...";
  try {
    const payload = { data: state.data, lancamentos: state.lancamentos };
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload),
      headers: { "Content-Type": "text/plain;charset=utf-8" },
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Erro desconhecido");
    showToast(`✓ Salvos ${json.totalInserted} pilares`, "success");
    STAGES.forEach(s => state.lancamentos[s.key] = []);
    STAGES.forEach(s => renderChips(s.key));
    saveState();
  } catch (err) {
    showToast("Erro ao enviar: " + err.message, "error");
  } finally {
    btn.textContent = originalText;
    updateSummary();
  }
}

// =========================================================
// REPORT — Geração para WhatsApp
// =========================================================

function openReport() {
  STAGES.forEach(s => commitTextarea(s.key));
  // Sincroniza reportState com pilares atuais (preserva configurações já feitas)
  STAGES.forEach(s => {
    const ids = state.lancamentos[s.key];
    if (ids.length === 0) { delete reportState.stages[s.key]; return; }
    if (!reportState.stages[s.key]) {
      reportState.stages[s.key] = { locais: [], pillars: [], maoObra: "", equipamentos: "" };
    }
    const existingMap = new Map(reportState.stages[s.key].pillars.map(p => [p.id, p]));
    reportState.stages[s.key].pillars = ids.map(id =>
      existingMap.get(id) || { id, dh: "", status: "ok" }
    );
  });
  renderReportBuilder();
  document.getElementById("obsInput").value = reportState.observacoes;
  document.getElementById("reportModal").classList.add("show");
  renderPreview();
}
function closeReport() { document.getElementById("reportModal").classList.remove("show"); }

function normalizeDh(raw) {
  if (!raw) return "";
  let s = String(raw).trim().toUpperCase().replace(/\s+/g, "");
  if (/^\d+$/.test(s)) return "DH-" + parseInt(s, 10);
  const m = s.match(/^DH-?0*(\d+)$/);
  if (m) return "DH-" + m[1];
  return s;
}
function parseLocais(raw) {
  if (!raw) return [];
  const seen = new Set();
  const out = [];
  raw.split(/[,;]/).forEach(x => {
    const n = normalizeDh(x);
    if (n && !seen.has(n)) { seen.add(n); out.push(n); }
  });
  return out;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function formatPillarCode(raw) {
  const m = String(raw).toUpperCase().match(/^P[-]?(.+)$/);
  return m ? "P-" + m[1] : String(raw);
}
function pad2(n) {
  const v = parseInt(n, 10);
  if (isNaN(v)) return "";
  return v < 10 ? "0" + v : "" + v;
}
function formatPillarLines(okList, wipList) {
  const all = [
    ...okList.map(p => ({ code: formatPillarCode(p.id), s: "✅" })),
    ...wipList.map(p => ({ code: formatPillarCode(p.id), s: "🚶‍♂️" })),
  ];
  if (all.length === 0) return "";
  const maxLen = Math.max(...all.map(c => c.code.length));
  let out = "";
  for (let i = 0; i < all.length; i += 2) {
    const a = all[i];
    const aStr = a.code.padEnd(maxLen) + " " + a.s;
    if (all[i+1]) {
      const b = all[i+1];
      const bStr = b.code.padEnd(maxLen) + " " + b.s;
      out += aStr + "  " + bStr + "\n";
    } else {
      out += aStr + "\n";
    }
  }
  return out;
}

function renderReportBuilder() {
  const wrap = document.getElementById("reportStages");
  wrap.innerHTML = "";
  const stagesWithData = STAGES.filter(s => reportState.stages[s.key]);
  if (stagesWithData.length === 0) {
    wrap.innerHTML = `<div class="empty-state">Adicione pilares no formulário principal antes de gerar o report.</div>`;
    return;
  }
  stagesWithData.forEach(s => {
    const data = reportState.stages[s.key];
    const info = STAGE_REPORT_INFO[s.key];
    const card = document.createElement("div");
    card.className = "report-stage";
    card.innerHTML = `
      <h3>${info.emoji} ${info.label}</h3>
      <div class="stage-total-hint">${data.pillars.length} pilar(es) lançado(s)</div>

      <label>Locais (DH) — separe por vírgula</label>
      <input type="text" id="locais-${s.key}" value="${escapeHtml(data.locais.join(', '))}" placeholder="Ex: 5, 7  ou  DH-5, DH-7">

      <label>Pilares (toque no ✅/🚶 para alternar status)</label>
      <div class="report-pillars" id="rp-${s.key}"></div>

      <label>Mão de Obra</label>
      <input type="number" id="mo-${s.key}" min="0" value="${escapeHtml(String(data.maoObra))}" placeholder="Ex: 08">

      <label>Equipamentos (um por linha)</label>
      <textarea id="eq-${s.key}" rows="3" placeholder="01 EH&#10;02 CB">${escapeHtml(data.equipamentos)}</textarea>
    `;
    wrap.appendChild(card);

    document.getElementById(`locais-${s.key}`).addEventListener("input", e => {
      data.locais = parseLocais(e.target.value);
      if (data.locais.length === 1) {
        data.pillars.forEach(p => { if (!p.dh) p.dh = data.locais[0]; });
      } else {
        const set = new Set(data.locais);
        data.pillars.forEach(p => { if (p.dh && !set.has(p.dh)) p.dh = ""; });
      }
      renderReportPillars(s.key);
      renderPreview();
    });
    document.getElementById(`mo-${s.key}`).addEventListener("input", e => {
      data.maoObra = e.target.value; renderPreview();
    });
    document.getElementById(`eq-${s.key}`).addEventListener("input", e => {
      data.equipamentos = e.target.value; renderPreview();
    });
    renderReportPillars(s.key);
  });
}

function renderReportPillars(stageKey) {
  const data = reportState.stages[stageKey];
  const wrap = document.getElementById(`rp-${stageKey}`);
  wrap.innerHTML = "";
  data.pillars.forEach(p => {
    const row = document.createElement("div");
    row.className = "report-pillar-row" + (!p.dh ? " unassigned" : "");

    const idSpan = document.createElement("span");
    idSpan.className = "rp-id";
    idSpan.textContent = formatPillarCode(p.id);

    const dhSelect = document.createElement("select");
    dhSelect.className = "rp-dh";
    const noneOpt = document.createElement("option");
    noneOpt.value = ""; noneOpt.textContent = "— DH —";
    dhSelect.appendChild(noneOpt);
    data.locais.forEach(loc => {
      const o = document.createElement("option");
      o.value = loc; o.textContent = loc;
      if (p.dh === loc) o.selected = true;
      dhSelect.appendChild(o);
    });
    dhSelect.addEventListener("change", e => {
      p.dh = e.target.value;
      row.classList.toggle("unassigned", !p.dh);
      renderPreview();
    });

    const statusBtn = document.createElement("button");
    statusBtn.type = "button";
    statusBtn.className = "rp-status";
    statusBtn.textContent = p.status === "ok" ? "✅" : "🚶‍♂️";
    statusBtn.title = "Toque para alternar entre concluído e em andamento";
    statusBtn.addEventListener("click", () => {
      p.status = (p.status === "ok") ? "wip" : "ok";
      statusBtn.textContent = p.status === "ok" ? "✅" : "🚶‍♂️";
      renderPreview();
    });

    row.append(idSpan, dhSelect, statusBtn);
    wrap.appendChild(row);
  });
}

document.getElementById("obsInput").addEventListener("input", e => {
  reportState.observacoes = e.target.value;
  renderPreview();
});

function generateReport() {
  const dateRaw = document.getElementById("dataExec").value;
  const dateBR = dateRaw ? dateRaw.split("-").reverse().join("/") : "____";
  let out = `📋REPORT DE PRODUÇÃO - FUNDAÇÕES - ${dateBR}\n`;

  STAGES.forEach(s => {
    const stageData = reportState.stages[s.key];
    if (!stageData || stageData.pillars.length === 0) return;
    const info = STAGE_REPORT_INFO[s.key];

    // Agrupa por DH, preservando a ordem em que foram declarados
    const groups = {};
    const orderedKeys = [];
    stageData.locais.forEach(loc => { groups[loc] = { ok: [], wip: [] }; orderedKeys.push(loc); });
    stageData.pillars.forEach(p => {
      const key = p.dh || "(sem local)";
      if (!groups[key]) { groups[key] = { ok: [], wip: [] }; orderedKeys.push(key); }
      if (p.status === "ok") groups[key].ok.push(p);
      else groups[key].wip.push(p);
    });

    const stageName = info.bold ? `*${info.label}*` : info.label;
    out += `${info.emoji} ${stageName}\n`;

    orderedKeys.forEach(loc => {
      const g = groups[loc];
      if (!g || (g.ok.length === 0 && g.wip.length === 0)) return;
      out += `Total: ${pad2(g.ok.length)}\n`;
      out += `Local: ${loc}\n`;
      out += formatPillarLines(g.ok, g.wip);
    });

    if (stageData.maoObra !== "" && stageData.maoObra != null) {
      out += `Mão de Obra: ${pad2(stageData.maoObra)}\n`;
    }
    out += `Equipamentos:\n`;
    const eq = (stageData.equipamentos || "").trim();
    if (eq) out += eq + "\n";
  });

  const obs = (reportState.observacoes || "").trim();
  out += `\n📌 Observações:\n${obs}`;
  return out;
}

function renderPreview() {
  if (!document.getElementById("reportModal").classList.contains("show")) return;
  document.getElementById("preview").value = generateReport();
}

async function copyReport() {
  const text = document.getElementById("preview").value;
  if (!text) { showToast("Nada para copiar", "error"); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast("✓ Report copiado!", "success");
  } catch (err) {
    const ta = document.getElementById("preview");
    ta.removeAttribute("readonly");
    ta.focus(); ta.select();
    try { document.execCommand("copy"); showToast("✓ Report copiado!", "success"); }
    catch (e2) { showToast("Selecione o texto manualmente e copie", "error"); }
    ta.setAttribute("readonly", "");
  }
}

// Inicialização
loadState();
STAGES.forEach(s => renderChips(s.key));
updateSummary();
</script>
